<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">
  <defs>
    <linearGradient id="flg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Glow Box -->
  <rect width="100%" height="100%" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Gradient Accent Line -->
  <rect x="24" y="20" width="4" height="60" rx="2" fill="url(#flg-grad)"/>
  
  <!-- Text Content -->
  <text x="44" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#f8fafc" letter-spacing="3">FLG</text>
  <text x="45" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">NEUROSCIENCE &amp; TECHNOLOGY</text>
  
  <!-- Neural Network / Synapse Tech Icon -->
  <g stroke="url(#flg-grad)" stroke-width="1.5">
    <line x1="315" y1="50" x2="330" y2="38" />
    <line x1="315" y1="50" x2="330" y2="62" />
    <line x1="330" y1="38" x2="345" y2="50" />
    <line x1="330" y1="62" x2="345" y2="50" />
  </g>
  <circle cx="315" cy="50" r="3.5" fill="#38bdf8"/>
  <circle cx="330" cy="38" r="3.5" fill="#818cf8"/>
  <circle cx="330" cy="62" r="3.5" fill="#818cf8"/>
  <circle cx="345" cy="50" r="3.5" fill="#38bdf8"/>
</svg>
