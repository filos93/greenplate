server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # SPA Routing: fallback all requests to index.html if file or directory does not exist
        try_files $uri $uri/ /index.html;
    }

    # Standard Nginx error page handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}