server {
    listen 80;
    server_name localhost;

    # Reverse-proxy API calls to the hosted Vercel serverless function
    location /api/ {
        proxy_pass https://flg-greenplate.vercel.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host flg-greenplate.vercel.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # SPA Routing: fallback all requests to index.html if file or directory does not exist
        try_files $uri $uri/ /index.html;
    }

    # Standard Nginx error page handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
